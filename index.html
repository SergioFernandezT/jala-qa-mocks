<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Interfaz - Font Avanzada</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 12px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .window {
            background-color: #f0f0f0;
            width: 490px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            background-color: #fff;
            border-bottom: 1px solid #e0e0e0;
            border-radius: 4px 4px 0 0;
        }

        .title-bar .icons { display: flex; gap: 10px; color: #666; cursor: pointer; }

        .tabs {
            display: flex;
            padding: 10px 10px 0 10px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #dcdcdc;
            gap: 2px;
        }

        .tab {
            padding: 5px 15px;
            background-color: #e1e1e1;
            border: 1px solid #ccc;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
        }

        .tab.active {
            background-color: #f0f0f0;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: -1px;
            position: relative;
            z-index: 1;
        }

        .content { padding: 15px; background-color: #f0f0f0; }

        .section {
            border-bottom: 1px solid #dcdcdc;
            padding-bottom: 10px;
            margin-bottom: 10px;
            position: relative;
        }
        .section:last-child { border-bottom: none; }

        .section-title { font-weight: 600; margin-bottom: 8px; color: #333; }

        .grid-3-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-2-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        label { display: block; margin-bottom: 3px; color: #333; }

        select, input[type="number"] {
            width: 100%;
            padding: 3px;
            border: 1px solid #a0a0a0;
            font-family: inherit;
            font-size: inherit;
            box-sizing: border-box;
            background-color: #fff;
        }

        select { height: 24px; }

        /* Selector de Color general */
        .color-picker-container { position: relative; }

        .btn-color {
            width: 100%;
            height: 24px;
            border: 1px solid #a0a0a0;
            background-color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 4px;
        }

        .color-preview { width: 14px; height: 14px; background-color: #000; border: 1px solid #ccc; margin-right: 5px; }
        .color-dropdown { color: #666; font-size: 10px; margin-left: auto; }

        .color-palette {
            display: none;
            position: absolute;
            top: 26px;
            left: 0;
            background: #fff;
            border: 1px solid #ccc;
            padding: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .color-palette.active { display: grid; }
        .color-swatch {
            width: 20px; height: 20px; border: 1px solid #999; cursor: pointer;
        }
        .color-swatch:hover { border-color: #000; transform: scale(1.1); }

        /* Caja azul para subrayado */
        .underline-style-box {
            background-color: #0078d7;
            border: 1px solid #005a9e;
            width: 100%;
            box-sizing: border-box;
        }
        .underline-style-box select {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            cursor: pointer;
        }
        .underline-style-box select option {
            background-color: white;
            color: black;
            padding: 4px;
        }

        /* Ejemplo visual del Subrayado */
        .underline-preview-text {
            display: inline-block;
            margin-top: 2px;
            font-size: 11px;
            padding: 0 2px;
        }

        .effects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
            margin-top: 5px;
        }

        .checkbox-group { display: flex; align-items: center; gap: 5px; }
        .checkbox-group input { margin: 0; cursor: pointer; }
        
        .offset-group { display: flex; align-items: center; gap: 5px; margin-top: 10px; justify-content: flex-start; }
        .offset-group input { width: 50px; }

        .footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 10px 15px;
            background-color: #f0f0f0;
            border-top: 1px solid #dcdcdc;
            border-radius: 0 0 4px 4px;
        }

        button {
            padding: 5px 20px;
            border: 1px solid #a0a0a0;
            background-color: #f0f0f0;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
        }
        button:hover { background-color: #e5e5e5; }

        /* Clase para deshabilitar */
        .disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>Font</span>
        <div class="icons"><span>?</span><span>✕</span></div>
    </div>

    <div class="tabs">
        <div class="tab active">Font</div>
        <div class="tab">Character Spacing</div>
    </div>

    <div class="content">
        
        <div class="section grid-3-cols">
            <div>
                <label>Latin text font:</label>
                <select id="fontFamily">
                    <option>+Body</option><option>Arial</option><option>Calibri</option><option>Times New Roman</option>
                </select>
            </div>
            <div>
                <label>Font style:</label>
                <select id="fontStyle">
                    <option>Regular</option><option>Bold</option><option>Italic</option><option>Italic Bold</option>
                </select>
            </div>
            <div>
                <label>Size:</label>
                <input type="number" id="fontSize" value="16.5" step="0.5">
            </div>
        </div>

        <div class="section">
            <div class="section-title">All text</div>
            <div class="grid-3-cols" style="align-items: flex-end;">
                <!-- Selector de Color de Muestra -->
                <div class="color-picker-container">
                    <label>Font color</label>
                    <div class="btn-color" id="colorBtn">
                        <div class="color-preview" id="colorPreview"></div>
                        <span class="color-dropdown">▼</span>
                    </div>
                    <div class="color-palette" id="colorPalette">
                        <div class="color-swatch" style="background-color: #000000;"></div>
                        <div class="color-swatch" style="background-color: #E74C3C;"></div>
                        <div class="color-swatch" style="background-color: #3498DB;"></div>
                        <div class="color-swatch" style="background-color: #2ECC71;"></div>
                        <div class="color-swatch" style="background-color: #F1C40F;"></div>
                        <div class="color-swatch" style="background-color: #9B59B6;"></div>
                        <div class="color-swatch" style="background-color: #E67E22;"></div>
                        <div class="color-swatch" style="background-color: #1ABC9C;"></div>
                        <div class="color-swatch" style="background-color: #34495E;"></div>
                        <div class="color-swatch" style="background-color: #95A5A6;"></div>
                    </div>
                </div>

                <!-- Selector de Subrayado con Ejemplos -->
                <div>
                    <label>Underline style</label>
                    <div class="underline-style-box">
                        <select id="underlineStyle">
                            <option value="none" style="text-decoration: none;">(none)</option>
                            <option value="underline" style="text-decoration: underline;">Single Line</option>
                            <option value="double" style="text-decoration: underline double;">Double Line</option>
                            <option value="dotted" style="text-decoration: underline dotted;">Dotted Line</option>
                            <option value="dashed" style="text-decoration: underline dashed;">Dashed Line</option>
                            <option value="wavy" style="text-decoration: underline wavy;">Wavy Line</option>
                        </select>
                    </div>
                    <!-- Ejemplo visual del subrayado -->
                    <div id="underlineExample" class="underline-preview-text">Ejemplo</div>
                </div>

                <!-- Selector de Color de Subrayado (Inicia deshabilitado) -->
                <div class="color-picker-container" id="underlineColorContainer">
                    <label>Underline color</label>
                    <div class="btn-color" id="underlineColorBtn">
                        <div class="color-preview" id="underlineColorPreview"></div>
                        <span class="color-dropdown">▼</span>
                    </div>
                    <div class="color-palette" id="underlineColorPalette">
                        <div class="color-swatch" style="background-color: #000000;"></div>
                        <div class="color-swatch" style="background-color: #0078d7;"></div>
                        <div class="color-swatch" style="background-color: #E74C3C;"></div>
                        <div class="color-swatch" style="background-color: #2ECC71;"></div>
                        <div class="color-swatch" style="background-color: #F1C40F;"></div>
                        <div class="color-swatch" style="background-color: #9B59B6;"></div>
                        <div class="color-swatch" style="background-color: #E67E22;"></div>
                        <div class="color-swatch" style="background-color: #1ABC9C;"></div>
                        <div class="color-swatch" style="background-color: #34495E;"></div>
                        <div class="color-swatch" style="background-color: #95A5A6;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Effects</div>
            <div class="effects-grid">
                <div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="strikethrough">
                        <label for="strikethrough">Strikethrough</label>
                    </div>
                    <div class="checkbox-group" style="margin-top: 5px;">
                        <input type="checkbox" id="doubleStrikethrough">
                        <label for="doubleStrikethrough">Double Strikethrough</label>
                    </div>
                    <div class="checkbox-group" style="margin-top: 5px;">
                        <input type="checkbox" id="superscript">
                        <label for="superscript">Superscript</label>
                    </div>
                    <div class="checkbox-group" style="margin-top: 5px;">
                        <input type="checkbox" id="subscript">
                        <label for="subscript">Subscript</label>
                    </div>
                </div>
                <div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="smallCaps">
                        <label for="smallCaps">Small Caps</label>
                    </div>
                    <div class="checkbox-group" style="margin-top: 5px;">
                        <input type="checkbox" id="allCaps">
                        <label for="allCaps">All Caps</label>
                    </div>
                    <div class="checkbox-group" style="margin-top: 5px;">
                        <input type="checkbox" id="equalizeHeight">
                        <label for="equalizeHeight">Equalize Character Height</label>
                    </div>
                </div>
            </div>
            
            <div class="offset-group">
                <label for="offset" style="margin:0;">Offset:</label>
                <input type="number" id="offset" value="0">
                <span>%</span>
            </div>
        </div>
    </div>

    <div class="footer">
        <button onclick="generarAlerta()">OK</button>
        <button>Cancel</button>
    </div>
</div>

<script>
    // --- 1. Lógica de Checkboxes Excluyentes ---
    const checkboxesExcluyentes = [
        ['strikethrough', 'doubleStrikethrough'],
        ['superscript', 'subscript'],
        ['smallCaps', 'allCaps']
    ];
    checkboxesExcluyentes.forEach(par => {
        const cb1 = document.getElementById(par[0]);
        const cb2 = document.getElementById(par[1]);
        cb1.addEventListener('change', () => { if(cb1.checked) cb2.checked = false; });
        cb2.addEventListener('change', () => { if(cb2.checked) cb1.checked = false; });
    });

    // --- 2. Lógica del Selector de Color General ---
    const colorBtn = document.getElementById('colorBtn');
    const colorPalette = document.getElementById('colorPalette');
    const colorPreview = document.getElementById('colorPreview');
    let selectedColor = '#000000';

    colorBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.color-palette').forEach(p => p.classList.remove('active')); // Cierra otros
        colorPalette.classList.toggle('active');
    });

    document.querySelectorAll('#colorPalette .color-swatch').forEach(swatch => {
        swatch.addEventListener('click', (e) => {
            selectedColor = e.target.style.backgroundColor;
            colorPreview.style.backgroundColor = selectedColor;
            colorPalette.classList.remove('active');
        });
    });

    // --- 3. Lógica de Subrayado (Habilitar color y generar ejemplos) ---
    const underlineStyle = document.getElementById('underlineStyle');
    const underlineExample = document.getElementById('underlineExample');
    const underlineColorContainer = document.getElementById('underlineColorContainer');
    const underlineColorBtn = document.getElementById('underlineColorBtn');
    const underlineColorPalette = document.getElementById('underlineColorPalette');
    const underlineColorPreview = document.getElementById('underlineColorPreview');
    
    let selectedUnderlineColor = '#0078d7'; // Color azul por defecto de PowerPoint

    function actualizarEjemploSubrayado() {
        const estilo = underlineStyle.value;
        const textoOpcion = underlineStyle.options[underlineStyle.selectedIndex].text;

        if (estilo === 'none') {
            // Deshabilitar selector de color
            underlineColorContainer.classList.add('disabled');
            // Quitar subrayado al ejemplo
            underlineExample.style.textDecoration = 'none';
            underlineExample.innerText = 'Ejemplo';
        } else {
            // Habilitar selector de color
            underlineColorContainer.classList.remove('disabled');
            // Aplicar estilo y color al ejemplo
            underlineExample.style.textDecoration = `underline ${estilo !== 'underline' ? estilo : ''}`.trim();
            underlineExample.style.textDecorationColor = selectedUnderlineColor;
            underlineExample.innerText = textoOpcion;
        }
    }

    // Escuchar cambios en el selector de estilo de subrayado
    underlineStyle.addEventListener('change', actualizarEjemploSubrayado);
    // Inicializar estado
    actualizarEjemploSubrayado();

    // Selector de color de subrayado
    underlineColorBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.color-palette').forEach(p => p.classList.remove('active'));
        underlineColorPalette.classList.toggle('active');
    });

    document.querySelectorAll('#underlineColorPalette .color-swatch').forEach(swatch => {
        swatch.addEventListener('click', (e) => {
            selectedUnderlineColor = e.target.style.backgroundColor;
            underlineColorPreview.style.backgroundColor = selectedUnderlineColor;
            underlineColorPalette.classList.remove('active');
            actualizarEjemploSubrayado(); // Actualizar ejemplo visual
        });
    });

    // Inicializar el color del preview
    underlineColorPreview.style.backgroundColor = selectedUnderlineColor;

    // Cerrar paletas al hacer clic en cualquier otro lado
    document.addEventListener('click', () => {
        document.querySelectorAll('.color-palette').forEach(p => p.classList.remove('active'));
    });

    // --- 4. Botón OK ---
    
        // --- 5. Lógica para el Offset automático (Superíndice y Subíndice) ---
    const cbSuper = document.getElementById('superscript');
    const cbSub = document.getElementById('subscript');
    const inputOffset = document.getElementById('offset');

    // Al marcar/desmarcar los checkboxes, cambia el offset
    cbSuper.addEventListener('change', () => {
        if (cbSuper.checked) {
            inputOffset.value = 30; // 30% para Superíndice
        } else {
            inputOffset.value = 0;
        }
    });

    cbSub.addEventListener('change', () => {
        if (cbSub.checked) {
            inputOffset.value = -25; // -25% para Subíndice
        } else {
            inputOffset.value = 0;
        }
    });

    // (Opcional) Si el usuario escribe un número en el Offset, se marcan las casillas automáticamente
    inputOffset.addEventListener('input', () => {
        const valor = parseFloat(inputOffset.value);
        if (valor > 0) {
            cbSuper.checked = true;
            cbSub.checked = false;
        } else if (valor < 0) {
            cbSub.checked = true;
            cbSuper.checked = false;
        } else {
            cbSuper.checked = false;
            cbSub.checked = false;
        }
    });

    function generarAlerta() {
        let efectos = [];
        if(document.getElementById('strikethrough').checked) efectos.push("Tachado");
        if(document.getElementById('superscript').checked) efectos.push("Superíndice");
        if(document.getElementById('smallCaps').checked) efectos.push("Small Caps");
        
        const underlineText = underlineStyle.options[underlineStyle.selectedIndex].text;
        const colorUnderline = underlineStyle.value === 'none' ? 'No aplica' : selectedUnderlineColor;

        alert(`Configuración seleccionada:\n\n` +
              `Fuente: ${document.getElementById('fontFamily').value} - ${document.getElementById('fontSize').value}pt\n` +
              `Color de texto: ${selectedColor}\n` +
              `Subrayado: ${underlineText}\n` +
              `Color de subrayado: ${colorUnderline}\n` +
              `Efectos: ${efectos.length > 0 ? efectos.join(", ") : "Ninguno"}`);
    }
</script>

</body>
</html>
